name: Build Fluffy Jar (test APK + Play AAB)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build debug APK (for testing on your phone)
        run: gradle --no-daemon assembleDebug

      - name: Decode release keystore (only if secret is set)
        id: ks
        env:
          KS_B64: ${{ secrets.FLUFFY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/fluffy-release.jks"
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release AAB (for Play Console)
        if: steps.ks.outputs.have == 'true'
        env:
          KS_PASS: ${{ secrets.FLUFFY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUFFY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FLUFFY_KEY_PASSWORD }}
        run: >
          gradle --no-daemon bundleRelease
          -PFLUFFY_KEYSTORE_PATH="$RUNNER_TEMP/fluffy-release.jks"
          -PFLUFFY_KEYSTORE_PASSWORD="$KS_PASS"
          -PFLUFFY_KEY_ALIAS="$KEY_ALIAS"
          -PFLUFFY_KEY_PASSWORD="$KEY_PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: FluffyJar-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.have == 'true'
        with:
          name: FluffyJar-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
